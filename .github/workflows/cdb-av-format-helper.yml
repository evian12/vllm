name: CDB-AV format helper

on:
  push:
    branches:
      - cdb-av-core-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: cdb-av-core-hardening
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.14.0
      - name: Format CDB-AV implementation
        shell: bash
        run: |
          set -euo pipefail
          files=(
            vllm/v1/core/sched/scheduler.py
            vllm/v1/engine/core.py
            vllm/v1/worker/gpu_model_runner.py
            vllm/v1/spec_decode/cdb_av_persistent.py
            vllm/v1/spec_decode/cdb_av_kv_reuse.py
            vllm/v1/spec_decode/cdb_av_refill.py
            vllm/v1/spec_decode/cdb_av_refill_queue.py
            vllm/v1/spec_decode/cdb_av_varlen.py
            vllm/v1/spec_decode/cdb_av_kv_metrics.py
            vllm/v1/spec_decode/eagle.py
            vllm/v1/spec_decode/draft_model.py
            vllm/v1/spec_decode/cdb_av_step_session.py
            vllm/v1/spec_decode/cdb_av_work_queue.py
            vllm/entrypoints/chat_utils.py
            vllm/entrypoints/serve/instrumentator/server_info.py
            vllm/entrypoints/openai/engine/serving.py
            vllm/entrypoints/sagemaker/routes.py
          )
          ruff check --fix "${files[@]}" || true
          ruff format "${files[@]}"
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vllm/v1/core/sched/scheduler.py vllm/v1/engine/core.py \
            vllm/v1/worker/gpu_model_runner.py vllm/v1/spec_decode \
            vllm/entrypoints/chat_utils.py \
            vllm/entrypoints/serve/instrumentator/server_info.py \
            vllm/entrypoints/openai/engine/serving.py \
            vllm/entrypoints/sagemaker/routes.py
          if ! git diff --cached --quiet; then
            git commit -m "CDB-AV: apply Ruff formatting"
            git push origin HEAD:cdb-av-core-hardening
          fi
